name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # veritract is not on PyPI yet — install it from source.
      - run: pip install "veritract @ git+https://github.com/LanGuo/veritract.git@main"
      - run: pip install -e '.[dev]'
      - run: pytest -q
